<!doctype html>
<!-- The farm day card for scripts/farm_day.py: 540×675 CSS px, rendered at 2× (1080×1350) by
     headless Chrome. The script replaces the DAY placeholder below with compute_day()'s output. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* One card: headline, totals, the hours, the flow, the miners, three numbers. A single dark look so it reads the same in any Telegram theme. */
:root {
  --bg: #0f1318; --panel: #171c23; --fg: #eef1f4; --fg-2: #b3bcc7; --fg-3: #7f8996; --rule: #262c35; --grid: #20262e;
  --sun: #e0a21a; --grid-in: #d95926; --miner: #3987e5; --other: #199e70;
  --display: "Bricolage Grotesque", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 540px; height: 675px; background: var(--bg); color: var(--fg); font: 12px/1.4 var(--body); overflow: hidden; }
.card { padding: 22px 24px 18px; display: grid; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; font: 500 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); }
.test { background: #f2c94c; color: #1a1500; padding: 3px 8px; border-radius: 4px; font-weight: 600; letter-spacing: .08em; }
h1 { font: 800 27px/1.05 var(--display); letter-spacing: -.015em; margin-top: 6px; }
h1 em { font-style: normal; color: var(--sun); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule); border-radius: 8px; overflow: hidden; }
.kpi { background: var(--panel); padding: 9px 10px 8px; }
.kpi b { display: block; font: 800 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.kpi b small { font: 500 10px var(--body); color: var(--fg-3); margin-left: 2px; }
.kpi span { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--fg-2); margin-top: 4px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.lbl { font: 500 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); display: flex; justify-content: space-between; align-items: center; }
.leg { display: flex; gap: 10px; letter-spacing: 0; text-transform: none; font: 10px var(--body); color: var(--fg-2); }
.leg i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.leg i.l { height: 2px; width: 12px; vertical-align: 2px; }
.box { display: grid; gap: 6px; }
svg { display: block; width: 100%; }
svg text { font: 9.5px var(--mono); fill: var(--fg-3); }
.foot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; border-top: 1px solid var(--rule); padding-top: 10px; }
.foot b { display: block; font: 800 17px/1.1 var(--display); }
.foot span { font-size: 10px; color: var(--fg-2); line-height: 1.3; display: block; margin-top: 2px; }
.src { font-size: 8.5px; color: var(--fg-3); margin-top: 8px; }
</style></head>
<body><div class="card">
  <div>
    <div class="top"><span id="farm"></span><span class="test" id="test" hidden>Test message</span></div>
    <h1 id="headline"></h1>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="box">
    <div class="lbl"><span>Hour by hour, kWh</span><span class="leg"><span><i style="background:var(--miner)"></i>Miners</span><span><i style="background:var(--other)"></i>House</span><span><i class="l" style="background:var(--sun)"></i>Solar</span></span></div>
    <svg id="hours" viewBox="0 0 492 136" style="height:136px"></svg>
  </div>
  <div class="box">
    <div class="lbl"><span>Where the energy went</span></div>
    <svg id="flow" viewBox="0 0 492 92" style="height:92px"></svg>
  </div>
  <div class="box">
    <div class="lbl"><span id="striplbl">Miner power</span><span>kWh · hours · avg TH/s</span></div>
    <svg id="strips" viewBox="0 0 492 84" style="height:84px"></svg>
  </div>
  <div>
    <div class="foot" id="foot"></div>
    <p class="src">Source: farm Home Assistant energy counters (inverters, grid meter, miner meters). House = solar + grid − miners.</p>
  </div>
</div>
<script>
const D = /*DAY*/null;
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const tx = (s, a, p) => { const e = el('text', a, p); e.textContent = s; return e; };
const hh = h => String(h).padStart(2, '0') + ':00';
const f1 = v => v.toFixed(1);
const T = D.totals;

document.getElementById('farm').textContent = `${D.farm} · ${D.day_short}`;
document.getElementById('test').hidden = !D.test;
const h1 = document.getElementById('headline');
if (D.solar_share_pct != null) { h1.innerHTML = `<em>${D.solar_share_pct}%</em> `; h1.append(D.headline.replace(/^\d+% /, '')); }
else h1.textContent = D.headline;
document.getElementById('kpis').innerHTML = [
  [T.solar, 'Solar produced', 'sun'], [T.miners, 'Miners used', 'miner'],
  [T.house, 'House &amp; other', 'other'], [T.import, `From grid · ${f1(T.export)} out`, 'grid-in'],
].map(([v, l, c]) => `<div class="kpi"><b>${f1(v)}<small>kWh</small></b><span><i class="dot" style="background:var(--${c})"></i>${l}</span></div>`).join('');

// hour by hour
(() => {
  const s = document.getElementById('hours'), W = 492, Ht = 136, L = 22, R = 4, Tp = 6, B = 16, pw = W - L - R, ph = Ht - Tp - B, bw = pw / 24;
  const H = D.hourly, top = Math.max(...H.solar, ...H.miners.map((m, i) => m + H.house[i]), 0.5);
  const step = top > 6 ? 2 : top > 3 ? 1 : 0.5, max = Math.ceil(top / step) * step;
  const x = i => L + i * bw, y = v => Tp + ph - v / max * ph;
  for (let v = 0; v <= max + 1e-9; v += step) { el('line', {x1:L, x2:W - R, y1:y(v), y2:y(v), stroke: v ? 'var(--grid)' : 'var(--rule)'}, s); tx(+v.toFixed(1), {x:L - 5, y:y(v) + 3, 'text-anchor':'end'}, s); }
  for (let i = 0; i <= 24; i += 3) tx(hh(i), {x:x(i), y:Ht - 3, 'text-anchor': i ? i == 24 ? 'end' : 'middle' : 'start'}, s);
  for (let i = 0; i < 24; i++) {
    const m = H.miners[i], o = H.house[i], bx = x(i) + 2, w = bw - 4;
    if (m > 0.005) el('rect', {x:bx, y:y(m), width:w, height:y(0) - y(m), rx:1.5, fill:'var(--miner)'}, s);
    if (o > 0.005) { const h = y(0) - y(o), t = y(m) - (m > 0.005 ? 1.5 : 0) - h; el('rect', {x:bx, y:t, width:w, height:Math.max(.6, h), rx:1.5, fill:'var(--other)'}, s); }
  }
  let d = ''; H.solar.forEach((v, i) => d += (i ? ' L' : 'M') + (x(i) + bw / 2) + ',' + y(v));
  el('path', {d, fill:'none', stroke:'var(--sun)', 'stroke-width':2, 'stroke-linejoin':'round'}, s);
  const pk = H.solar.indexOf(Math.max(...H.solar));
  if (H.solar[pk] > 0) {
    el('circle', {cx:x(pk) + bw / 2, cy:y(H.solar[pk]), r:3.2, fill:'var(--sun)', stroke:'var(--bg)', 'stroke-width':1.5}, s);
    tx(`peak ${f1(H.solar[pk])} kWh, ${hh(pk)}`, {x:x(pk) + bw / 2 - 8, y:y(H.solar[pk]) - 7, 'text-anchor':'end', style:'fill:var(--fg-2)'}, s);
  }
  if (D.night_house_kwh_h != null) tx(`nights ≈${D.night_house_kwh_h.toFixed(1)} kWh/h`, {x:W - R, y:y(D.night_house_kwh_h) - 22, 'text-anchor':'end', style:'fill:var(--fg-2)'}, s);
})();

// where the energy went
(() => {
  const s = document.getElementById('flow'), total = T.solar + T.import, k = 78 / Math.max(total, 0.1), g = 8, nw = 8, xL = 62, xR = 400;
  const S = [{n:'Solar', v:T.solar, c:'var(--sun)'}, {n:'Grid', v:T.import, c:'var(--grid-in)'}];
  const Dn = [{n:'Miners', v:T.miners_solar + T.miners_grid, c:'var(--miner)'}, {n:'House', v:T.house_solar + T.house_grid, c:'var(--other)'}];
  let y = 2; S.forEach(n => { n.y = n.o = y; y += n.v * k + g; }); y = 2; Dn.forEach(n => { n.y = n.o = y; y += n.v * k + g; });
  [[0, 0, T.miners_solar], [0, 1, T.house_solar], [1, 0, T.miners_grid], [1, 1, T.house_grid]].forEach(([a, b, v]) => {
    if (v <= 0) return;
    const A = S[a], B = Dn[b], h = v * k, y0 = A.o, y1 = B.o; A.o += h; B.o += h; const x0 = xL + nw, x1 = xR, c = (x0 + x1) / 2;
    el('path', {d:`M${x0},${y0} C${c},${y0} ${c},${y1} ${x1},${y1} L${x1},${y1 + h} C${c},${y1 + h} ${c},${y0 + h} ${x0},${y0 + h} Z`, fill:A.c, 'fill-opacity':.35}, s);
    if (h >= 10) tx(f1(v), {x:c, y:(y0 + y1) / 2 + h / 2 + 3, 'text-anchor':'middle', style:'fill:var(--fg);font-weight:500'}, s);
  });
  S.forEach(n => { el('rect', {x:xL, y:n.y, width:nw, height:Math.max(1, n.v * k), rx:2, fill:n.c}, s); tx(`${n.n} ${f1(n.v)}`, {x:xL - 6, y:n.y + n.v * k / 2 + 3, 'text-anchor':'end', style:'fill:var(--fg)'}, s); });
  Dn.forEach(n => { el('rect', {x:xR, y:n.y, width:nw, height:Math.max(1, n.v * k), rx:2, fill:n.c}, s); tx(`${n.n} ${f1(n.v)}`, {x:xR + nw + 6, y:n.y + n.v * k / 2 + 3, style:'fill:var(--fg)'}, s); });
})();

// the miners: average draw per slice, between the first and the last light (whole hours)
(() => {
  const s = document.getElementById('strips'), per = 60 / D.bin_minutes;
  const h0 = D.light_h ? Math.max(0, Math.floor(D.light_h[0])) : 6, h1 = D.light_h ? Math.min(24, Math.ceil(D.light_h[1]) + 1) : 20;
  document.getElementById('striplbl').textContent = `Miner power, ${hh(h0)}–${hh(h1)}`;
  const M = D.miners, rh = Math.min(17, (70 - (M.length - 1) * 6) / Math.max(1, M.length)), gp = 6;
  const L = 40, Rw = 124, W = 492, n = (h1 - h0) * per, cw = (W - L - Rw) / n;
  const top = Math.max(...M.flatMap(m => m.watts), 1);
  M.forEach((m, r) => {
    const y = r * (rh + gp);
    tx(m.name, {x:0, y:y + rh / 2 + 3.5, style:'fill:var(--fg);font-weight:500'}, s);
    el('rect', {x:L, y, width:n * cw, height:rh, rx:2, fill:'var(--grid)'}, s);
    m.watts.slice(h0 * per, h1 * per).forEach((w, i) => { if (w > 0) el('rect', {x:L + i * cw + .5, y, width:cw - 1, height:rh, rx:1, fill:'var(--miner)', 'fill-opacity':(.15 + .85 * Math.min(1, w / top)).toFixed(2)}, s); });
    tx(`${f1(m.kwh)} · ${f1(m.hours)} h · ${f1(m.avg_th_s)}`, {x:W, y:y + rh / 2 + 3.5, 'text-anchor':'end', style:'fill:var(--fg-2)'}, s);
  });
  const yb = M.length * (rh + gp) + 8, tick = h1 - h0 > 9 ? 3 : 2;
  for (let h = h0; h <= h1; h += tick) tx(hh(h), {x:L + (h - h0) * per * cw, y:yb, 'text-anchor': h == h0 ? 'start' : h + tick > h1 ? 'end' : 'middle'}, s);
})();

// three numbers
(() => {
  const c = D.commands, facts = [];
  if (D.hashes) facts.push([D.hashes_sci, D.j_per_th ? `hashes, at about ${Math.round(D.j_per_th)} J/TH` : 'hashes']);
  if (c.total) facts.push([`${c.total} commands`, `${c.start} starts · ${c.stop} stops · ${c.limit} limit changes`]);
  if (D.grid_topup) facts.push([`${f1(D.grid_topup.kwh)} kWh`, `grid top-up to the miners, most between ${D.grid_topup.from} and ${D.grid_topup.to}`]);
  else if (D.self_use_pct != null) facts.push([`${D.self_use_pct}%`, 'of the solar energy used on site']);
  document.getElementById('foot').innerHTML = facts.slice(0, 3).map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join('');
})();
</script></body></html>
