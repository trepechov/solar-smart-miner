name: Release

# A vX.Y.Z tag (pushed by scripts/release.sh) becomes a GitHub release. HACS tracks releases,
# so Home Assistant shows it under Settings → Updates with these notes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

# GitHub can start this twice for one tag push (it did for v0.7.2). Runs for the same tag queue
# behind each other, and the second one finds the release already there and stops.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags and commits, for the notes

      - name: Tag matches manifest version
        run: |
          VERSION=$(jq -r .version custom_components/solar_smart_miner/manifest.json)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but manifest.json says $VERSION"
            exit 1
          fi

      # Work goes straight to main (no PRs), so the notes are the commits since the last tag,
      # without the release commits themselves.
      - name: Release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## Changes"
            git log --no-merges --format='- %s' ${PREV:+"$PREV.."}"$GITHUB_REF_NAME" | grep -v '^- chore(release):'
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, nothing to do"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
