name: Release

# A push to main that raises the version in manifest.json becomes a GitHub release, tagged
# v<version>. HACS tracks releases, so Home Assistant shows it under Settings → Updates with
# these notes. The version bump goes in with the work it releases: no separate release commit,
# no tag pushed by hand. Pushes that leave the version alone release nothing.
on:
  push:
    branches: [main]
    paths: ["custom_components/solar_smart_miner/manifest.json"]
  workflow_dispatch:  # re-run by hand: releases the current version if it isn't released yet

permissions:
  contents: write

# Two runs for the same commit queue behind each other; the second finds the release and stops.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags and commits, for the notes

      - name: Version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version custom_components/solar_smart_miner/manifest.json)
          TAG="v$VERSION"
          LATEST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          echo "manifest $VERSION, latest tag ${LATEST:-none}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released, nothing to do"
            exit 0
          fi
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$TAG" | sort -V | tail -n1)" != "$TAG" ]; then
            echo "::error::manifest.json version $VERSION is below the latest release $LATEST"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous=$LATEST" >> "$GITHUB_OUTPUT"

      # Work goes straight to main (no PRs), so the notes are the commits since the last release.
      - name: Release notes
        if: steps.version.outputs.tag
        env:
          PREV: ${{ steps.version.outputs.previous }}
        run: |
          {
            echo "## Changes"
            git log --no-merges --format='- %s' ${PREV:+"$PREV.."}"$GITHUB_SHA" | grep -v '^- chore(release):'
          } > notes.md
          cat notes.md

      - name: Publish release
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
