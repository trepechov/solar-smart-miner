# How the energy signals behave. Read the README for the format.
entries:
  - id: energy.budget-formula
    title: How the power budget is computed
    statement: >
      The controller's budget for the miners is the grid balance plus what the miners draw
      now: available = (export - import) + miners' draw. It is exact while the inverters are
      not throttled.
    priority: P3
    status: verified
    source: "code: coordinator._derive_balance"
    date: "2026-10-05"
    tags: [always, allocation]
    note: Solar-max adds the minimum import to it (rule.small-import-target); the forecast is never added (rule.forecast-reference-only).

  - id: energy.throttle-hides-headroom
    title: Throttling hides extra solar
    statement: >
      While the inverters hold output to the load, the budget equals what the miners already
      draw, so it never shows spare solar. On 2026-10-05 around noon the panels could give
      about 9.7 kW and the miners used 3.9 kW, with their own power limits as the only brake.
    priority: P3
    status: verified
    source: "measured: forecast 9.7 kW against 3.9 kW drawn, 2026-10-05 14:00"
    date: "2026-10-05"
    situations: [situation.curtailed]
    tags: [midday, allocation, curtailed]

  - id: energy.forecast-headroom-flips
    title: The forecast headroom comes and goes
    statement: >
      While the meter sits near 0 W, Solar-max adds the forecast for now minus the actual PV to
      the budget. It needs both readings, so in a cycle where the PV reading is missing the
      headroom disappears and the budget drops by that much.
    priority: P3
    status: retired
    source: "measured: decision log and grid history from the live HA, 2026-10-07; code: decision._solar_follow_extra"
    date: "2026-10-07"
    situations: [situation.curtailed]
    tags: [midday, allocation, curtailed]
    note: >
      On 2026-10-07 from 12:00 to 14:30 the grid stayed within 75 W of 0 and the measured budget
      near 6,100 W, while the full budget swung between 6,100 and 7,600 to 8,700 W from one minute
      to the next. The plan went between "Brod1 2,100 W only" and "every miner to 2,500 W" with it.
      Smoothing (rule.smooth-inputs) or keeping the last headroom over a missing reading would
      steady it. Retired 2026-10-07: the forecast no longer sizes the budget (rule.forecast-reference-only).

  - id: energy.evening-curve
    title: What the sunset looked like
    statement: >
      On 2026-10-05, with three miners at 1300 W, PV fell from 3.0 kW at 17:02 to 1.45 kW at
      17:41, 0.85 kW at 18:02 and 0.2 kW at 18:17. Grid import grew from 1.3 kW at 17:14 to
      3.7 kW at 18:10 and reached 6.1 kWh between 17:00 and 19:12 (about 3.3 kWh after
      sunset), until the schedule paused the miners at 19:00 to 19:10.
    priority: P3
    status: verified
    source: "measured: HA history, 2026-10-05"
    date: "2026-10-05"
    tags: [sunset]

  - id: energy.morning-curve
    title: Morning rise
    statement: >
      On 2026-10-08 (clear, all miners paused) the inverters woke at about 07:15 (sun 0 deg), PV
      covered the house and the meter reached 0 W at 07:45 (5 deg), and they reported power
      limited from 07:50 (6 deg), steadily from about 08:15 (10 deg). How fast the real potential
      rises after that is not known: throttled, PV only shows the load.
    priority: P3
    status: verified
    source: "measured: HA history of the inverter status, PV and the meter, 2026-10-08"
    date: "2026-10-08"
    tags: [sunrise]
    note: >
      One clear morning in early October; the times move with the season. Starts at the import
      floor (rule.small-import-target) will show when a 900 W miner can first be carried.

  - id: energy.unseen-load
    title: A load outside the miners can appear
    statement: >
      Besides the miners there can be other load behind the meter, of any size and at any time,
      and the integration doesn't see it while house consumption is not configured. The budget
      then counts it as power the miners must give up. Its size and timing vary (and with the
      season), so no fixed value or hour is assumed for it.
    priority: P3
    status: verified
    source: "measured: HA history, grid import, inverter active power and miner sum, 2026-10-07"
    date: "2026-10-07"
    tags: [always, grid]
    note: >
      Evidence, not a value to plan with: on 2026-10-07 the import rose by about 1.9 kW in one
      minute for about 8 minutes, with PV and the miners unchanged. Against site.load-is-miners
      (about 98% miners); what such loads are is open.unseen-load.

  - id: energy.pv-sum-unreliable
    title: The PV sum drops out
    statement: >
      sensor.active_power_total reads unknown every few minutes through the evening, for
      seconds to minutes at a time, probably when an inverter doesn't answer. It is fine as a
      reference value, not as a control signal.
    priority: P3
    status: verified
    source: "measured: HA history 17:00 to 20:00, 2026-10-05"
    date: "2026-10-05"
    tags: [always, alerts, dropout]

  - id: energy.meter-dropouts
    title: The meter drops out briefly
    statement: >
      sensor.power_meter_active_power was unavailable for about 35 seconds at 17:39 and again
      around 18:43 on 2026-10-05. Such short gaps are normal and must not make the controller act.
    priority: P3
    status: verified
    source: "measured: HA history, 2026-10-05"
    date: "2026-10-05"
    tags: [always, alerts, dropout]

  - id: energy.transition-import-ok
    title: Importing during transitions is fine
    statement: >
      Some grid import is acceptable at sunrise, at sunset and while clouds pass, even for
      several minutes or longer. Production changes fast then and should not be chased.
    priority: P3
    status: decided
    source: "requirements doc §0 point 9, §0.2 point 3"
    date: "2026-10-05"
    situations: [situation.sunrise, situation.sunset, situation.cloud]
    tags: [sunrise, sunset, cloud]

  - id: energy.small-import-proves-use
    title: A small steady import is the goal
    statement: >
      With no battery, a small constant grid import proves all available solar is being used.
      At zero import a throttled inverter gives no sign that more is available.
    priority: P3
    status: decided
    source: "requirements doc §0 point 4, §6.2"
    date: "2026-10-05"
    situations: [situation.midday, situation.curtailed]
    tags: [midday, allocation, curtailed]

  - id: energy.voltage-source
    title: Which voltage to watch
    statement: >
      Mining below about 210 V is not recommended. No voltage sensor has been chosen yet;
      the inverters and the meter both report it (the meter read 238.6 V on 2026-10-05).
    priority: P3
    status: assumed
    source: "requirements doc §3.3; meter reading measured 2026-10-05"
    date: "2026-10-05"
    tags: [always, voltage]
    note: 'Open question: which entity, and a hard-stop threshold.'
