# How the miners behave. Read the README for the format.
entries:
  - id: miner.fleet
    title: Three Braiins miners
    statement: >
      Three miners, Brod1, Brod2 and Brod3, run Braiins OS and are read through hass-miner
      (one config entry per miner). Each has a power limit (a number entity, range 500 to
      3500 W in steps of 100 W) and a pause/resume switch (switch.brodN_active).
    priority: P3
    status: verified
    source: "measured: HA entity registry, 2026-10-05"
    date: "2026-10-05"
    tags: [always]

  - id: miner.immersion
    title: Immersion cooled, no fans
    statement: >
      The miners are immersion cooled and have no fans. Temperature follows power and the
      cooling directly. The only Braiins OS temperature setting that matters is the cutoff,
      about 80 deg C, which restarts the miner.
    priority: P3
    status: decided
    source: "requirements doc §0 point 5, §3.2"
    date: "2026-10-05"
    tags: [always, temperature]

  - id: miner.draw-vs-limit
    title: A miner draws a little under its limit
    statement: >
      At a 1300 W limit a miner draws about 1280 to 1300 W. Budgets should expect the draw
      to be 5 to 20 W under the limit, not exactly the limit.
    priority: P3
    status: verified
    source: "measured: three miners at 1300 W limit, 2026-10-05"
    date: "2026-10-05"
    tags: [always, midday]

  - id: miner.hashrate-noise
    title: Hashrate is noisy
    statement: >
      At a steady power the hashrate of one miner moves between about 47 and 66 TH/s from
      one minute to the next. A single low reading means nothing.
    priority: P3
    status: verified
    source: "measured: Brod1 after resume, 2026-10-05 07:00"
    date: "2026-10-05"
    tags: [always, alerts]

  - id: miner.efficiency-range
    title: Efficient between 1000 and 2000 W
    statement: >
      The miners have similar efficiency between about 1000 W and 2000 W. So 4000 W is
      better used by three miners near 1330 W than by two at 2000 W.
    priority: P3
    status: assumed
    source: "requirements doc §1; owner's belief, not measured"
    date: "2026-10-05"
    tags: [midday, allocation]
    note: >
      Measured 2026-10-06: 1300 and 1500 W give the same J/TH (miner.settled-values). Nothing is
      measured above 1500 W or below 1300 W, so the 1000 to 2000 W claim is still only half checked.

  - id: miner.retune
    title: A limit change starts a long tuning
    statement: >
      After a power limit changes, a miner spends 14 minutes to an hour tuning to find the
      best settings for that wattage. Once a wattage has been tuned, going back to it is
      quick and reaches full efficiency within a couple of minutes. This is why limits only
      move between a few fixed steps.
    priority: P3
    status: decided
    source: "owner, 2026-10-05"
    date: "2026-10-05"
    situations: [situation.tuning]
    tags: [always, allocation, tuning]
    note: Not seen in the recorded data; no limit changes exist in the history.

  - id: miner.tuning-not-exposed
    title: The tuning state isn't available
    statement: >
      hass-miner doesn't expose whether a miner is tuning or stable. sensor.brodN_active_preset_name
      reads unknown even while the miner runs. The controller estimates it as the time since
      the power limit last changed.
    priority: P3
    status: verified
    source: "measured: HA states, 2026-10-05"
    date: "2026-10-05"
    situations: [situation.tuning]
    tags: [always, allocation, tuning]

  - id: miner.limit-change-cost
    title: Cost of a limit change
    statement: >
      Changing the power limit restarts the miner: the pause switch reads off for 30 to 40 seconds about
      30 seconds after the change, hashrate falls to about 40 TH/s, and power is at the new limit within
      about 4 minutes. After that the miner is still tuning (miner.tuning-duration).
    priority: P3
    status: verified
    source: "measured: Brod1 09:31 and Brod2 09:47, 1300 W to 1500 W, 2026-10-06"
    date: "2026-10-06"
    tags: [allocation, tuning]
    situations: [situation.tuning]
    note: Two samples, both 1300 to 1500 W. A decrease, or a different step, is not measured yet.

  - id: miner.resume-cost
    title: Resuming a paused miner
    statement: >
      After resume, power reaches about 1.4 kW within 90 seconds and settles near the limit
      by about 6 minutes. Hashrate is about 25 TH/s at 30 s and 47 TH/s at 90 s.
    priority: P3
    status: verified
    source: "measured: Brod1 resume on 2026-10-05 07:00"
    date: "2026-10-05"
    tags: [sunrise, startup]

  - id: miner.pause-cost
    title: Pausing a miner
    statement: >
      A paused miner drops to 0 W within about 25 seconds and its hashrate decays over about
      a minute. While paused its power sensor reads unknown, not 0.
    priority: P3
    status: verified
    source: "measured: Brod1 pause on 2026-10-05 19:00"
    date: "2026-10-05"
    tags: [sunset]

  - id: miner.power-sensor-unknown-when-paused
    title: A paused miner looks unreachable
    statement: >
      Because the power sensor reads unknown while a miner is paused (or its relay is off),
      the miner looks unreachable unless the pause switch or the relay is checked too.
      A paused miner is stopped, not broken.
    priority: P3
    status: verified
    source: "measured: HA states after the 19:00 pause, 2026-10-05; fixed in the controller"
    date: "2026-10-05"
    tags: [always, alerts]

  - id: miner.tuning-signature
    title: What an untuned miner looks like
    statement: >
      Right after a limit change a miner draws the new power but hashes poorly: at 1300 W
      Brod1 gave about 59 TH/s at 22 J/TH, and 3 to 9 minutes after moving to 1500 W it gave
      47 to 50 TH/s at 30 to 32 J/TH. Efficiency (J/TH) is the clearest sign, because a
      tuned miner at a higher power should do better, not worse, in TH/s.
    priority: P3
    status: verified
    source: "measured: Brod1 history 09:20 to 09:40, 2026-10-06"
    date: "2026-10-06"
    situations: [situation.tuning]
    tags: [allocation, alerts, tuning]
    note: >
      No sensor says "tuning"; efficiency is only a proxy. How long it lasts and what it settles at
      are in miner.tuning-duration and miner.settled-values.

  - id: miner.tuning-duration
    title: How long a tuning takes
    statement: >
      After a change from 1300 to 1500 W, hashrate and efficiency climbed steadily: efficiency 31 J/TH at
      4 minutes, 27.7 at 8, 24.7 at 12 and 22.2 at 16, within about 3% of the final value. Brod1 was
      steady from about 30 minutes, Brod2 from about 35. Hashrate rose from about 48 to 68 TH/s over the
      first 16 minutes while power stayed flat at the limit.
    priority: P3
    status: verified
    source: "measured: Brod1 from 09:31 and Brod2 from 09:47, 4 minute averages, 2026-10-06"
    date: "2026-10-06"
    tags: [allocation, tuning]
    situations: [situation.tuning]
    note: Two samples at one step. Matches the owner's 14 minutes to an hour; the 2 to 3 minute ramp is only the power.

  - id: miner.settled-values
    title: What a tuned miner gives at each step
    statement: >
      Settled, Brod1 gives 60 TH/s at 21.6 J/TH at 1300 W and 70 TH/s at 21.5 J/TH at 1500 W. Brod2 gives
      58 TH/s at 22.2 J/TH at 1300 W and about 66 TH/s at 22.5 J/TH at 1500 W. Efficiency is the same at
      both steps, so 1500 W gives 13 to 17% more hashrate for the same J/TH.
    priority: P3
    status: verified
    source: "measured: last hour at 1300 W and 30 to 60 minutes after the change to 1500 W, 2026-10-06"
    date: "2026-10-06"
    tags: [allocation, tuning, midday]
    situations: [situation.tuning]
    note: Brod3 at 1300 W (not changed) is steady at about 58 TH/s. Nothing is measured at 900 W or 1100 W.

  - id: miner.hashrate-dips
    title: Short hashrate dips at 1500 W
    statement: >
      Tuned miners at 1500 W show hashrate dips of 1 to 3 minutes, to under 85% of their median, every 8 to
      15 minutes, with the power unchanged. They do not happen at the same time on both miners, and Brod3
      at 1300 W showed none in the same period.
    priority: P3
    status: verified
    source: "measured: Brod1 and Brod2 from 09:50 to 10:35, 2026-10-06"
    date: "2026-10-06"
    tags: [alerts, tuning]
    situations: [situation.tuning]
    note: Cause unknown (pool, the miner's own re-tuning, or the higher power). Don't read one as tuning or a fault.
