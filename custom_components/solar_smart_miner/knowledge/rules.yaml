# The control rules. P0 and P1 are what the AI's answer is checked against.
# Read the README for the format.
entries:
  # --- P0: hard limits -----------------------------------------------------
  - id: rule.guard-above-ai
    title: Safety sits above the AI
    statement: >
      Every AI answer passes through the safety rules first. The AI can propose, never
      bypass: a proposal that breaks a P0 or P1 rule is dropped and logged.
    priority: P0
    status: decided
    source: "requirements doc §7"
    date: "2026-10-05"
    tags: [always]
    note: >
      Enforced once AI proposals can be applied (requirements doc §7 roadmap stage 2, plan
      2026-10-06-001 Phase 3). Today no AI answer reaches control.py, so there is nothing to
      filter yet; the enforcement point will be the same async_apply guards the rule plan uses.

  - id: rule.one-controller
    title: One controller at a time
    statement: >
      The fixed-hour schedule automation and this integration never control the miners
      automatically together. The schedule is switched off before automatic applying starts.
      In Manual mode the owner is the controller and is warned while the schedule is on.
    priority: P0
    status: decided
    source: "requirements doc §0 point 10; Manual exception: plan 2026-10-06-001 Decision 4"
    date: "2026-10-06"
    tags: [always, startup]
    note: >
      Until 2026-10-06 this read "never control the miners together; the schedule is switched off
      when applying starts". Narrowed to automatic control when the manual Apply buttons came in.
      The Manual-mode warning needs the schedule-automation setting (plan S10).
      With Automatic available (2026-10-07) the owner switches the schedule off before choosing it;
      the integration doesn't check (S10 is a follow-up, not a prerequisite).

  - id: rule.miner-range
    title: Stay inside the miner's range
    statement: >
      A power limit is always inside the miner's own minimum and maximum, and is one of the
      configured power steps.
    priority: P0
    status: decided
    source: "requirements doc §3.1; power steps decided 2026-10-05"
    date: "2026-10-05"
    tags: [always]

  - id: rule.sustained-low-voltage
    title: Low voltage steps miners down
    statement: >
      A sustained low voltage (below the configured voltage limit, averaged over 30 to 60
      seconds, never a single dip) steps the miners down, and may change several at once.
    priority: P0
    status: decided
    source: "requirements doc §3.3; limit made a setting, owner 2026-10-07"
    date: "2026-10-07"
    tags: [always, voltage]
    note: >
      The voltage limit is a setting, 210 V by default (the reference farm, on a 230 V supply);
      the setting is not in the code yet. The sensor and a hard-stop threshold are still open.

  - id: rule.temperature-is-braiins
    title: The miner's cutoff is the last defense
    statement: >
      The Braiins OS cutoff is the final line of defense and the plugin does not track it. The
      plugin only follows a target temperature plus a tolerance. A miner too hot at its lowest
      step is not the plugin's job; at most it is noted in the decision trace.
    priority: P0
    status: decided
    source: "requirements doc §0.3"
    date: "2026-10-05"
    tags: [always, temperature]

  # --- P1: operating rules --------------------------------------------------
  - id: rule.apply-by-hand-first
    title: Applying starts by hand
    statement: >
      Decisions are first applied only when the owner presses Apply for a proposed action, and
      only the plan that was shown is carried out. In this phase only the rule plan is applied,
      not the AI answer (the AI gains authority later, in stages, requirements doc §7). Automatic
      applying comes later as a toggle on the same path, once the manual phase
      shows the plans can be trusted.
    priority: P1
    status: retired
    source: "owner, 2026-10-06; plan docs/plans/2026-10-06-001-feat-semi-automatic-apply-plan.md"
    date: "2026-10-07"
    tags: [always, startup]
    note: >
      The manual phase ended on 2026-10-07: after two days of applying proposals by hand the
      owner judged them good enough to run on their own. Replaced by rule.automatic-mode.

  - id: rule.automatic-mode
    title: Automatic applies the rule plan every cycle
    statement: >
      In the Automatic control mode the rule plan is applied at the end of every cycle, through
      the same path as the Apply button, stops and step-downs first. In Manual (the default)
      nothing is applied without a press. Only the rule plan is applied, never the AI answer.
    priority: P1
    status: decided
    source: "owner, 2026-10-07; plan docs/plans/2026-10-06-001-feat-semi-automatic-apply-plan.md Phase 2"
    date: "2026-10-07"
    tags: [always, startup]
    note: >
      The ramp lock (rule.ramp-lock) is its only pacing; the owner ruled out a persistence window,
      an hourly cap, a failure freeze and a schedule guard as prerequisites. A refused plan is
      logged once and not retried until the plan or the reason changes. Preview mode was removed
      at the same time: Manual already applies nothing unless the owner presses.
      This answers the former open.go-live-evidence (requirements doc §9 point 8) by judgement,
      not by counts: two days of applying by hand were enough. Counting proposals applied,
      expired or reversed (plan S14) is still worth doing to tune the rules. Seen in the manual
      phase: the 2026-10-07 sunset stop of Brod3 was proposed at 17:04 and pressed at 17:10, with
      1.2 to 1.4 kW of import in between; Brod2's stop waited 3 minutes (17:28 to 17:31).

  - id: rule.power-steps
    title: Move between fixed steps
    statement: >
      Limits only move between the configured power steps (each miner using the ones in its
      own range). Never ask for a wattage between two steps. The smallest change is one step.
    priority: P1
    status: decided
    source: "owner, 2026-10-05; ladder to 2,500 W, owner 2026-10-07"
    date: "2026-10-07"
    tags: [always, allocation]
    note: >
      The steps depend on the miner type and are a setting. The default is the reference farm's
      ladder (S9s), 900 to 2,500 W in 200 W steps.
      900 to 1,500 W was the first ladder (2026-10-05). Owner, 2026-10-07: up to 2,500 W is normal
      and every miner has run these steps; steps above 2,500 W are welcome later if the temperature
      limits (rule.temperature-band) are not hit.

  - id: rule.no-step-up-while-tuning
    title: No step up while tuning
    statement: >
      A miner is not stepped up while it is still tuning after its last change. Stepping down and
      stopping are always allowed.
    priority: P1
    status: decided
    source: "owner, 2026-10-05; scope from round 7, 2026-10-07"
    date: "2026-10-07"
    situations: [situation.tuning]
    tags: [always, allocation, tuning]
    note: >
      Tuning is an exception, not the normal cost of a change: it happens on a step a miner has
      never run (miner.revisit-is-a-restart). A change to a tuned step costs only the ramp lock.
      On the reference farm (S9s, Braiins OS) tuning takes about 50 minutes.

  - id: rule.stop-below-lowest-step
    title: Stop, don't idle
    statement: >
      When the budget doesn't cover the lowest step, the miner is stopped through its stop
      procedure (a relay switch if configured, otherwise its own pause switch), not left
      running at a hardware minimum. It is started again when its lowest step fits with a
      small margin. The miner's lowest configured step is the pause threshold; there is no
      separate one. A shortfall must outlast the cloud tolerance before a miner is paused
      (rule.down-slowly-up-promptly).
    priority: P1
    status: decided
    source: "requirements doc §0 point 7, §5.3, §0.6 round 7; owner, 2026-10-05 and 2026-10-07"
    date: "2026-10-07"
    situations: [situation.sunset, situation.night]
    tags: [always, sunset, sunrise, allocation, night]
    note: >
      On the reference farm the lowest step is 900 W (the 1000 W threshold was dropped in
      round 7) and the start margin is 100 W.

  - id: rule.hold-on-sensor-drop
    title: A sensor drop holds, it doesn't re-tune
    statement: >
      When the solar or meter sensor drops out, every miner is held as it is. A short gap
      must never make the miners change.
    priority: P1
    status: retired
    source: "decided 2026-10-05 after the 17:39 and 18:43 dropouts"
    date: "2026-10-07"
    situations: [situation.dropout]
    tags: [always, alerts, dropout]
    note: >
      Replaced by rule.required-inputs (round 7, 2026-10-07): only the inputs the profile needs
      count, and Solar-follow doesn't need the solar sensor.

  - id: rule.required-inputs
    title: Only the inputs the profile needs count
    statement: >
      Solar-follow needs the grid import, not the solar sensor. While the grid import is
      unknown, nothing steps up and a short gap changes nothing. If it stays unknown, step down
      or pause (alert sensor.meter-lost: warning at 10 minutes, step down at 30). A solar
      sensor dropout changes nothing.
    priority: P1
    status: decided
    source: "requirements doc §0.6 round 7; owner, 2026-10-07"
    date: "2026-10-07"
    situations: [situation.dropout]
    tags: [always, alerts, dropout]
    note: >
      Replaces the code's "solar sensor unavailable → minimum", which watches the wrong sensor.
      Not in the code yet (v0.7.1 still holds every miner on a solar dropout). Seen 2026-10-07:
      it fired about 10 times from 09:32 to 13:30, each time turning the plan to hold all for one
      cycle and back the next. The AI did the same at 17:33, holding "due to unknown solar
      production".

  - id: rule.jump-several-steps
    title: A change may skip steps
    statement: >
      A limit may move several steps in one change. It costs one restart, the same as one step,
      so on a big change go straight to the target step rather than one step per cycle.
    priority: P1
    status: decided
    source: "owner, 2026-10-07"
    date: "2026-10-07"
    tags: [always, allocation, cloud]
    note: Still subject to rule.down-slowly-up-promptly; skipping steps is about how far, not how soon.

  - id: rule.one-miner-per-change
    title: One miner restarts at a time
    statement: >
      A normal change touches one miner. The next miner changes only after the previous one is
      back at its new power (the ramp lock) and the readings still call for it. Only safety may
      change several miners at once. A change that restarts several miners together drops the
      farm's load to almost nothing for minutes; zero-export inverters throttle down to the house and
      the grid covers the gap when the miners come back.
    priority: P1
    status: decided
    source: "owner, 2026-10-07; requirements doc §5 (minimise restarts per decision, safety skips the queue)"
    date: "2026-10-07"
    tags: [always, allocation]
    note: >
      Seen 2026-10-07: the rules proposed Brod1 2,300 to 2,500 W, Brod2 and Brod3 2,100 to 2,500 W
      in one proposal, three restarts for +1,000 W. In the code since 2026-10-07: a shortfall goes to
      the hungriest miner that can take all of it (rule.step-down-allocation), else the lowest-power
      one stops; spare power starts a stopped miner at its lowest step first, else raises the weakest
      running miner as far as it fits (rule.jump-several-steps). The AI prompt asks for one miner too.
      Seen again 2026-10-07 16:02 (local), on v0.7.0 which didn't have the rule yet: a 3.4 kW
      shortfall gave one proposal of Brod1 and Brod2 2,300 to 1,300 W and Brod3 to 1,100 W. Applied
      by hand, all three restarted in the same cycle: the miners' load fell from 6.95 kW to almost
      0, the inverters throttled to about 225 W each, and the next two decisions read the restarting
      miners as stopped (budget 234 W, "all stopped", then "start all at 1,900 W"). The same
      readings on the rule's code propose pausing Brod3 only, Brod1 and Brod2 holding.

  - id: rule.minimise-restarts
    title: Few restarts
    statement: >
      Restarts are the main cost. One miner changed by a lot beats three changed by a little,
      except when safety needs several, or when pausing one and raising another is better.
    priority: P1
    status: decided
    source: "requirements doc §0 point 8, §0.1 point 1"
    date: "2026-10-05"
    tags: [always, allocation]

  - id: rule.ramp-lock
    title: No decision while ramping
    statement: >
      While any miner is ramping after a change, the decision is hold. Its readings are
      misleading then. The ramp lock is how long a miner takes to reach full hashrate on a step
      it has run before; the log gives the reason as ramping.
    priority: P1
    status: decided
    source: "requirements doc §5.2, §0.6 round 7; owner, 2026-10-07"
    date: "2026-10-07"
    situations: [situation.tuning]
    tags: [always, allocation]
    note: >
      The ramp time depends on the miner type and is to become a setting like the power steps
      (owner, 2026-10-07). On the reference farm (S9s, Braiins OS) a miner is back in 3 to 4
      minutes, so the lock is 4 minutes.
      In the code since 2026-10-07: every miner holds for 4 minutes after any change (a command
      sent, or a limit, stop or start seen on a miner) and while a command is still being checked.
      Safety doesn't wait. The trace and summary say "Waiting for a miner to restart".
      Without it (v0.7.0, 2026-10-07) a restarting miner reports nothing and is read as stopped:
      right after Brod1 went to 2,100 W the rules proposed Brod2 up as if Brod1 drew 0 W, and after
      the 16:02 bundle they proposed starting all three at 1,900 W. Still open: a miner that is
      still unreadable after the 4 minutes counts as stopped again.
      Owner, 2026-10-07: a miner needs about 4 to 5 minutes to settle after a change, and changing
      anything inside that window starts an endless change loop. In Automatic this lock is the only
      pacing (rule.automatic-mode). A failed send starts it too, and it is restored from the action
      log after a reload or restart.

  - id: rule.consolidate-needs-sustained-deficit
    title: Don't consolidate on a cloud
    statement: >
      Pausing one miner and raising the others restarts all of them, and a passing cloud may
      reverse it soon. Do it only for a sustained deficit.
    priority: P1
    status: decided
    source: "requirements doc §5.3"
    date: "2026-10-05"
    situations: [situation.sunset, situation.cloud]
    tags: [cloud, sunset, allocation]

  - id: rule.transitions-tolerant
    title: Don't chase sunrise, sunset or clouds
    statement: >
      Import during a transition is accepted and there is no give-up rule. Don't step down
      for a deficit shorter than a typical cloud, and don't step up for a surplus that hasn't held.
    priority: P1
    status: decided
    source: "requirements doc §0.2, §5.4"
    date: "2026-10-05"
    situations: [situation.sunrise, situation.sunset, situation.cloud]
    tags: [sunrise, sunset, cloud]

  - id: rule.small-import-target
    title: Aim for a small steady import
    statement: >
      In Solar-follow, keep a small steady grid import, never below the floor (a setting). Below it
      the solar covers the house (site.base-load) and the inverters may be holding back: add one
      increment, starting a stopped miner first. Well above the band: step down. Inside: hold.
      The band must be wider than one power step. Solar-follow is for a farm with no battery whose inverters
      limit export; with export allowed, steer on the export instead, and with a battery
      these rules don't apply (battery profiles are open).
    priority: P1
    status: decided
    source: "requirements doc §6.2; owner, 2026-10-08 (floor 250 W)"
    date: "2026-10-08"
    situations: [situation.midday, situation.curtailed, situation.sunrise]
    tags: [midday, sunrise, allocation]
    note: >
      Owner, 2026-10-08: the floor is 250 W, with a 300 W band; this settles the old question of
      the import target and band defaults. In the code since 2026-10-08, for Solar-max: import
      below the floor (setting, 250 W) takes
      one increment even without the spare power for it, starting a stopped miner first, else one
      step up on the weakest running miner; up to 300 W above the floor holds; above that steps
      down after the step-down delay (rule.down-slowly-up-promptly). Before, the budget had to
      cover a start (lowest step + 100 W) while a throttled meter can only show the import
      target, so a stopped farm never started (rule.resume-next-at-sunrise, 2026-10-08).

  - id: rule.forecast-reference-only
    title: The solar forecast never decides
    statement: >
      The solar forecast can be far off. It is shown and logged for reference, and monitored,
      but no decision is based on it: not the budget, not a step up, not a stop. While the
      inverters may be throttled, spare power is found by stepping up one step and watching
      the import.
    priority: P1
    status: decided
    source: "owner, 2026-10-07"
    date: "2026-10-07"
    tags: [always, allocation, curtailed]
    note: >
      Until 2026-10-07 Solar-max added forecast PV now minus actual PV to the budget when the
      meter sat near 0 W (energy.forecast-headroom-flips); removed in the code the same day.

  - id: rule.goal
    title: Use as much excess energy as possible
    statement: >
      The goal is the most hashrate from as much of the excess energy as possible. That does
      not mean the highest power per miner (rule.prefer-spread).
    priority: P1
    status: decided
    source: "requirements doc §0 point 3, §1; mixed fleets, review 2026-10-07"
    date: "2026-10-07"
    tags: [always]

  - id: rule.ai-is-advisor
    title: The rules control, the AI advises
    statement: >
      The rule-based controller decides what happens to the miners. The AI gets the same
      inputs plus the rule proposal and gives its own proposal, which is logged next to the
      rules' so the disagreements can be studied. It does not change the miners.
    priority: P1
    status: decided
    source: "requirements doc §0 point 1, §7"
    date: "2026-10-05"
    tags: [always, ai]

  - id: rule.down-slowly-up-promptly
    title: Step down slowly, step up promptly
    statement: >
      Step down only when a deficit has lasted longer than the cloud tolerance, so a passing
      cloud costs no restarts. Step up once a surplus has held for the smoothing window, since
      extra sun is pure gain. Fast reactions are for safety only (voltage, sensor health).
    priority: P1
    status: decided
    source: "requirements doc §0.4 round 5 point 2, accepted 2026-10-06"
    date: "2026-10-06"
    tags: [always, cloud, allocation]
    note: >
      In the code since 2026-10-08 (Solar-max): the import must stay above the band for the
      step-down delay (setting, 5 min) before a step down, counted again after each change; while
      the sun is rising (until solar noon) the morning delay (setting, 30 min) applies. Owner,
      2026-10-08: some import in the morning is acceptable, the sun will come, so no back-off
      after a start that imports. The smoothing window is still not in the code.
      Before (v0.7.1) it stepped down on one reading once the shortfall passed 150 W.
      Seen 2026-10-07 at sunset: with import about 160 W above the target the plan went Brod1
      1,300 to 1,100 W (17:21), to 900 W (17:22), then stop Brod2 (17:28), three different
      plans in 7 minutes.

  - id: rule.temperature-band
    title: Follow a target temperature with a tolerance
    statement: >
      Temperature only limits; a low temperature is never a reason to step up. Below the target
      it doesn't block a step-up the energy calls for. Between the target and target plus
      tolerance the miner holds, even with spare energy. At or above target plus tolerance it
      steps down. There is no extra margin below the target. Temperature steps follow the
      normal pace and never skip the queue.
    priority: P1
    status: decided
    source: "requirements doc §0 point 6, §3.2, §0.6 round 7"
    date: "2026-10-07"
    tags: [always, temperature, allocation]
    note: >
      Default target 60 deg C, tolerance 10 deg C (owner, 2026-10-07; 65 deg C before). In the
      settings since 2026-10-06, replacing
      the old 80 deg C ceiling. A too-warm miner steps down one step; one too warm at its lowest
      step is held there and only noted in the trace.

  - id: rule.temperature-after-change
    title: Ignore temperature right after a change
    statement: >
      Every settings change restarts the miner, so its temperature always falls first and
      then climbs again. Until the miner has ramped back up, its temperature is not a reason
      to step it up or down, and it is not a step-up candidate.
    priority: P1
    status: decided
    source: "requirements doc §0.3 point 3, §0.4 round 5 point 3"
    date: "2026-10-06"
    tags: [always, temperature, allocation]
    note: >
      How long "ramped back up" is: about 4 minutes for a step the miner has run before
      (miner.revisit-is-a-restart). The ramp lock covers that; the tuning time setting (0 by
      default since 2026-10-07) adds more for a step a miner has never run.

  - id: rule.transition-by-agreement
    title: Sunrise and sunset need several signals
    statement: >
      The controller is in sunrise or sunset mode only when most of these agree: measured
      solar (or actual PV) rising or falling, the time of day against the sun, and the
      forecast for now against the next hour.
    priority: P1
    status: decided
    source: "requirements doc §0.1 point 5, §5.4"
    date: "2026-10-05"
    tags: [sunrise, sunset]

  - id: rule.sunrise-fast
    title: Sunrise may add miners quickly
    statement: >
      The sun can rise fast, so in sunrise mode miners may be added before the usual hold
      time has passed. A decision still never acts on the readings of a miner that is ramping.
    priority: P1
    status: decided
    source: "requirements doc §0.1 point 3, §5.4"
    date: "2026-10-05"
    tags: [sunrise]

  - id: rule.sunset-one-by-one
    title: Sunset stops miners one at a time
    statement: >
      In sunset mode, step miners down and stop them one at a time, in order, without chasing
      every dip.
    priority: P1
    status: decided
    source: "requirements doc §0.1 point 5, §5.4"
    date: "2026-10-05"
    tags: [sunset]

  - id: rule.full-power
    title: Full power ignores the sun
    statement: >
      In Full power, every miner goes as high as temperature allows, whatever the sun and the
      battery. The hard limits (voltage, sensor health, battery floor) still apply.
    priority: P1
    status: retired
    source: "requirements doc §6.4"
    date: "2026-10-06"
    tags: [always]
    note: >
      Dropped in round 6 (requirements doc §0.5, §6.5): running everything at maximum needs no
      decisions, so it is not a profile.

  # --- P2: guidance ----------------------------------------------------------
  - id: rule.prefer-spread
    title: More miners in the efficient range
    statement: >
      With miners of similar efficiency (J/TH), prefer several in their efficient range over
      fewer pushed harder, as long as each is above the pause threshold. With mixed models,
      power goes to the most efficient miners first and is cut from the least efficient first.
    priority: P2
    status: decided
    source: "requirements doc §5.3; mixed fleets, review 2026-10-07"
    date: "2026-10-07"
    situations: [situation.midday]
    tags: [midday, allocation]

  - id: rule.fill-running-first
    title: Fill a running miner before starting another
    statement: >
      Step a running miner up to its top step before starting a stopped one: at 2,100 W one
      miner goes to 1,500 W rather than a second one starting.
    priority: P2
    status: retired
    source: "code: decision._allocate, a choice made 2026-10-05, not yet confirmed by the owner"
    date: "2026-10-07"
    tags: [sunrise, allocation]
    note: Rejected by the owner in round 7 (2026-10-07); replaced by rule.resume-next-at-sunrise.

  - id: rule.asymmetric-reaction
    title: Down quickly, up slowly
    statement: >
      Step down fairly quickly on a sustained deficit. Step up only after the surplus has held
      for a while, except at sunrise.
    priority: P2
    status: retired
    source: "requirements doc §5.2 (a suggestion)"
    date: "2026-10-06"
    tags: [always, allocation]
    note: Reversed by round 5 of the requirements doc; replaced by rule.down-slowly-up-promptly.

  - id: rule.step-down-allocation
    title: Which miner steps down
    statement: >
      Take a deficit from the highest-power miner that stays at or above its lowest step after
      the cut. Only when no running miner can, stop the lowest-power one and let the next
      step-up rebalance. Hot miners are not picked here; they step down through the
      temperature rule.
    priority: P2
    status: decided
    source: "requirements doc §0.4 round 5 point 4, §5.3; owner, 2026-10-07"
    date: "2026-10-07"
    tags: [cloud, sunset, allocation]
    note: >
      Owner, 2026-10-07: for a big cut, pausing one miner is the efficient way. It is one change,
      and the other two keep running. Example: a 3.4 kW shortfall with three miners at 2,300 W
      pauses one miner (about 2.3 kW) and leaves the others; the next decision, after the ramp
      lock, takes what is left.

  - id: rule.resume-next-at-sunrise
    title: Start the next miner rather than raise the last
    statement: >
      At sunrise, start the next stopped miner at its lowest step rather than raising the one
      that just started. Production keeps rising, so raising one miner again and again costs a
      restart each time. Start each miner at the lowest step, and the next one when there is
      budget for its lowest step.
    priority: P1
    status: decided
    source: "requirements doc §5.3, §5.4, §0.6 round 7; owner, 2026-10-07"
    date: "2026-10-08"
    tags: [sunrise, allocation]
    note: >
      2026-10-08: with all miners paused the meter sat at 0 W from 07:45, the inverters reported
      power limited from 07:50, and nothing started until Brod1 was started by hand at 09:54. With
      zero export the budget never showed the 1,000 W a start needed. Since 2026-10-08 an import
      below the floor starts the next stopped miner (rule.small-import-target).

  - id: rule.no-import-cap
    title: No cap on grid import
    statement: >
      There is no maximum grid import. The miners don't run at their hardware maximum because
      of cooling, so temperature is the limit that matters.
    priority: P2
    status: decided
    source: "requirements doc §0 point 12"
    date: "2026-10-05"
    tags: [always, grid]

  - id: rule.smooth-inputs
    title: Decide on averages
    statement: >
      Decide on the energy inputs (grid import, solar) averaged over 3 minutes rather than the
      latest sample. Temperature is not smoothed.
    priority: P2
    status: decided
    source: "requirements doc §0.6 round 7; owner, 2026-10-07"
    date: "2026-10-07"
    tags: [always, allocation]
    note: >
      Not in the code yet (v0.7.1 decides on the latest sample). Seen 2026-10-07 12:00 to 14:30:
      the budget swung between about 6,100 and 7,600 to 8,700 W from one minute to the next
      (energy.forecast-headroom-flips) and the plan flipped with it, so two applies were refused
      as stale (12:04, 14:41).

  - id: rule.stop-trigger-below-start
    title: Stop at a lower level than start
    statement: >
      Whatever the triggers turn out to be, the level that stops the last miner sits below the
      level that starts it, so it doesn't start and stop while production hovers near one value.
    priority: P2
    status: assumed
    source: "requirements doc §5.4 (a suggestion)"
    date: "2026-10-05"
    situations: [situation.sunrise]
    tags: [sunrise, sunset]

  # --- conflicts: needs a decision --------------------------------------------
  - id: conflict.pause-threshold
    title: Pause below 1000 W, or below 900 W?
    statement: >
      The requirements doc says a miner below about 1000 W is not worth running and should
      be paused. The power steps start at 900 W, so a miner may run at 900 W today.
    priority: P1
    status: retired
    source: "requirements doc §0 point 7 against owner's steps, 2026-10-05; settled by owner 2026-10-07"
    date: "2026-10-07"
    tags: [sunset, allocation]
    note: >
      Settled 2026-10-07 (round 7): running at 900 W is fine, the 1000 W figure is dropped, and
      the lowest step is the pause threshold. Now part of rule.stop-below-lowest-step.

  - id: conflict.control-model
    title: Budget model or import band?
    statement: >
      The requirements doc steers on a small grid import band, because throttling hides the
      real solar. The code allocates from a computed budget (grid balance plus miner draw) with
      a 150 W tolerance and a 100 W margin. The two behave differently while the inverters
      are throttled.
    priority: P3
    status: retired
    source: "requirements doc §6.2 against code, 2026-10-05; owner, 2026-10-06"
    date: "2026-10-06"
    tags: [midday, allocation]
    note: >
      Resolved 2026-10-06 for rule.small-import-target: the owner saw the controller keep the
      import at 0 W and the inverters throttled. The budget model stays, shifted by the
      import target, so the band falls out of the existing tolerance and margin.

  - id: conflict.ramp-vs-tuning
    title: 3 minutes or an hour?
    statement: >
      The requirements doc assumes a change costs a restart plus a 2 to 3 minute ramp, with a
      minimum hold time of 10 to 15 minutes. The owner says a miner tunes for 14 minutes to an
      hour. The two give very different hold times.
    priority: P1
    status: retired
    source: "requirements doc §5.1, §5.2 against owner, 2026-10-05; settled by owner 2026-10-07"
    date: "2026-10-07"
    tags: [always, allocation]
    note: >
      Measured 2026-10-06 (Brod1, Brod2, 1300 to 1500 W): both statements are true at different time scales.
      The restart and the power ramp take about 4 minutes; the tuning to within 10% of final efficiency takes
      17 to 20 minutes and the probing dips end at about 46. Settled 2026-10-07 by the owner: the miners keep
      the settings from their first tuning at a wattage, so a change to a step tuned before costs only the
      restart (2 to 3 minutes, measured about 4); the long tuning is for a step a miner has never run.
      Replaced by miner.revisit-is-a-restart.

  - id: conflict.morning-order
    title: Fill the running miner or start the next?
    statement: >
      The code steps a running miner up to its top step before starting a stopped one. The
      requirements doc suggests starting the next stopped miner at sunrise instead, so the
      first one isn't restarted right after its ramp.
    priority: P2
    status: retired
    source: "code: decision._allocate against requirements doc §5.4, 2026-10-06; settled by owner 2026-10-07"
    date: "2026-10-07"
    tags: [sunrise, allocation]
    note: Settled 2026-10-07 (round 7) for rule.resume-next-at-sunrise; rule.fill-running-first is retired.

  - id: conflict.power-steps-config
    title: Which power steps does the farm use?
    statement: >
      The farm's settings have nine steps, 900 to 2,500 W in 200 W steps. rule.power-steps says
      900 to 1,500 W, and the miners are measured only up to 1,900 W (miner.settled-values). The
      2,100 to 2,500 W steps may still need a first tuning of about 50 minutes on some miners,
      not a 4-minute restart.
    priority: P1
    status: retired
    source: "measured: decision trace from the live HA, 2026-10-07; settled by owner 2026-10-07"
    date: "2026-10-07"
    tags: [always, allocation, tuning]
    note: >
      Settled 2026-10-07 by the owner: 900 to 2,500 W is the normal ladder and every miner has run
      it (rule.power-steps, miner.revisit-is-a-restart); the default steps are now the same. Seen
      before that: 2026-10-07 used them: Brod1 2,100 W at 12:30 and 2,300 W at 13:20, Brod2 2,100 and 2,300 W,
      Brod3 2,300 W at 14:48, with plans for 2,500 W all afternoon. Whether a miner had run these
      steps before is not known from the logs. The code waits 0 minutes for tuning
      (DEFAULT_TUNING_SETTLE_MINUTES), so it treats every step as already tuned. Settle by the
      owner confirming the steps, and by checking the efficiency in the first hour after each
      miner's first change to 2,100 W or more.
