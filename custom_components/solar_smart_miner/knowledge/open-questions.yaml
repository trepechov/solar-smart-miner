# Questions, not facts. Never sent to the AI. When one is settled, write the answer as a
# fact in the right file and retire the question here. Read the README for the format.
entries:
  - id: open.limit-change-cost
    title: What does a power-limit change cost?
    statement: >
      Does changing the limit really restart the miner (0 W, then a 2 to 3 minute ramp), and
      how long until the miner is efficient again?
    priority: P3
    status: open
    source: "requirements doc §9 point 2"
    date: "2026-10-05"
    tags: [allocation]
    note: >
      Measure on the first applied step: power and hashrate every few seconds for an hour.
      Sets the hold times. conflict.ramp-vs-tuning was settled by the owner on 2026-10-07
      (miner.revisit-is-a-restart); the measurement should confirm it.

  - id: open.tuning-state-source
    title: Can the tuning state be read?
    statement: >
      Can the miner's firmware report its tuning state (through hass-miner or its own
      API), so the controller doesn't have to estimate it?
    priority: P3
    status: open
    source: "owner, 2026-10-05; hass-miner exposes nothing, see miner.tuning-not-exposed"
    date: "2026-10-09"
    tags: [allocation]
    note: >
      Without a field, efficiency (J/TH) is a candidate proxy (see miner.tuning-signature): call a
      miner settled when its efficiency stops improving over about 10 minutes and is near the value
      it had when last stable at that step. Needs the settled values per step to compare against.
      Made a principle 2026-10-09 (the integration is for any farm). Reference farm, the
      statement until then: Is there a Braiins OS field (through its API or pyasic) that
      says whether a miner is tuning or stable, so the controller doesn't have to guess
      from time since the last change?

  - id: open.temperature-settle-time
    title: How long until the temperature means something again?
    statement: >
      After a change the miner restarts and its temperature falls, then climbs back. The
      hashrate is back in 3 to 4 minutes, the temperature takes longer. How long, so the
      minimum hold time (the settling window) can be set?
    priority: P3
    status: open
    source: "owner, 2026-10-07 (round 7)"
    date: "2026-10-07"
    tags: [temperature, allocation]
    note: >
      Measure from the 2026-10-06 changes in the recorder history: time from the change until the
      temperature is back within about 1 deg C of where it levels off.

  - id: open.efficiency-above-2000
    title: Efficiency above 2000 W
    statement: Is efficiency really worse above about 2000 W, and does "prefer more miners" still hold when there is sun for all of them?
    priority: P3
    status: open
    source: "requirements doc §9 point 3"
    date: "2026-10-07"
    tags: [midday, allocation]
    note: >
      No longer moot: since 2026-10-07 the steps go up to 2,500 W (rule.power-steps). Measure the
      settled efficiency at 2,100 to 2,500 W against miner.settled-values.

  - id: open.rise-and-fall-speed
    title: How fast does production rise and fall?
    statement: >
      How many watts per 10 minutes at sunrise and sunset, how long from first light to
      enough for one and two miners, and how long a typical cloud lasts? It sets the start
      and stop triggers and the pace of transitions.
    priority: P3
    status: open
    source: "requirements doc §5.4, §9 point 1"
    date: "2026-10-05"
    tags: [sunrise, sunset, cloud]
    note: >
      Use only periods with import, the forecast, or unthrottled actual PV. Throttled history shows
      the load. Partly measured from the recorder (2026-10-06 to 10-08, miners' draw plus grid
      balance outside changes): about +200 to +750 W per 15 minutes from 08:00 to 10:00 on 10-07,
      within about 100 W at midday without clouds, clouds 350 to 900 W either way, and a steady
      fall from about 16:30. transition.py uses 150 W per 15 minutes. Still open: cloud length,
      and the time from first light to enough for one and two miners.

  - id: open.voltage-sensor
    title: Which voltage sensor, and the hard-stop level
    statement: Which entity gives the voltage to act on (inverter AC or grid), and is there a lower hard-stop level such as 200 V that pauses everything?
    priority: P3
    status: open
    source: "requirements doc §9 point 5"
    date: "2026-10-05"
    tags: [voltage]

  - id: open.ai-learning
    title: How the AI learns from the history
    statement: >
      Examples in the prompt, a summary of statistics, or offline review turned into rule
      changes? Whichever it is, the log first needs outcome fields (what was applied, restarts,
      import and hashrate afterwards, whether it was reversed).
    priority: P3
    status: open
    source: "requirements doc §7, §9 point 7"
    date: "2026-10-05"
    tags: [ai]

  - id: open.ai-authority-evidence
    title: When does the AI get more authority?
    statement: >
      What evidence moves the AI from advisor to choosing allocation (requirements doc §7
      roadmap stage 2)? This is a separate gate from switching the rules to automatic.
    priority: P3
    status: open
    source: "doc review of plan 2026-10-06-001, 2026-10-06"
    date: "2026-10-06"
    tags: [ai, startup]
    note: >
      Candidate measure: from actions.jsonl joined with ai_log.jsonl, how often the AI differed
      from the rule plan (including on hold plans) and how outcomes compare when the owner applied
      a plan the AI agreed with versus one it disagreed with.

  - id: open.ai-answer-format
    title: Should the AI answer name a step per miner?
    statement: >
      The requirements doc §7 decided a target wattage per miner in the AI answer; the prompt now
      says "never suggest other wattages" and the answer is only increase/reduce/hold/stop/start.
      An AI answer can only be applied (stage 2) if it names a target, most likely a power step.
    priority: P3
    status: open
    source: "requirements doc §7 against ai.py prompt, 2026-10-06"
    date: "2026-10-07"
    tags: [ai]
    note: >
      Seen 2026-10-07 (mistralai/mistral-nemo): at 17:30 and 17:31 it said "reduce Brod2" while
      Brod2 was at 1,100 W and the rules said stop, so the two can't be compared. Most reasons were
      "other", and at 17:02 it gave temperature_limit for Brod1 at 40 deg C against a 60 deg C
      target. At 17:00 and 17:02 it changed all three miners, on v0.7.0 before
      rule.one-miner-per-change was in the knowledge base; from 17:04 it changed one at a time.
      A step per miner and a checked reason would make each answer comparable.

  - id: open.west-shading
    title: Is the west slope shaded in the evening?
    statement: The evening forecast runs about twice the real output at 17:00. Is that shading from the neighbouring house and trees, a different tilt, or something else?
    priority: P3
    status: open
    source: "owner and measured, 2026-10-05"
    date: "2026-10-05"
    tags: [sunset, forecast]
    note: Compare unthrottled evening hours over several days, and the real roof tilt.

  - id: open.alert-routes
    title: Where do alerts go, and when?
    statement: >
      Which notification service (a mobile push, Telegram, both), whether warnings are held
      overnight, and how a critical alert is acknowledged. The Telegram options are stored
      in the settings but not used yet.
    priority: P3
    status: open
    source: "owner, 2026-10-05"
    date: "2026-10-05"
    tags: [alerts]

  - id: open.unseen-load
    title: What loads besides the miners are behind the meter?
    statement: >
      Load outside the miners shows up in the grid import (energy.unseen-load). What can it be,
      and is it worth a house consumption sensor so the budget can tell it from the miners?
    priority: P2
    status: open
    source: "measured: HA history, 2026-10-07"
    date: "2026-10-07"
    tags: [grid, alerts]
    note: >
      Example: about 1.9 kW for about 8 minutes on 2026-10-07 from 15:55, origin unknown. Its size
      and timing vary, so the answer is a sensor or a rule, not a fixed value or hour.

  - id: open.per-miner-steps
    title: Should each miner have its own power steps?
    statement: >
      One global ladder is clipped to each miner's min and max, but hass-miner's range (500 to
      3,500 W here) is a generic slider, not the hardware's. A mixed fleet (an 800 W miner next
      to a 3.2 kW one) gets the same steps. Is a per-miner step setting needed?
    priority: P3
    status: open
    source: "genericity review, 2026-10-07 (deferred by the owner)"
    date: "2026-10-07"
    tags: [allocation]
    note: >
      Proposed: a per-miner steps map like the relay map, the global steps staying the default.

  - id: open.model-scoped-facts
    title: Which miner facts belong to one model or firmware?
    statement: >
      Every miner fact here was measured on one model and firmware (the reference farm's).
      Should facts carry the model they apply to, so a farm with mixed models gets the
      right ones?
    priority: P3
    status: open
    source: "genericity review, 2026-10-07 (deferred by the owner)"
    date: "2026-10-09"
    tags: [allocation, tuning]
    note: >
      Made a principle 2026-10-09 (the integration is for any farm). Reference farm, the
      statement until then: The miner facts (tuning time, ramp, efficient range, hashrate
      band, "every change restarts") were measured on the reference farm's S9s with
      Braiins OS but read as true for every miner. Should they carry a model or firmware
      scope, so another model gets its own?

  - id: open.cooling-type
    title: Do air-cooled miners need other temperature defaults?
    statement: >
      The 60 deg C target and 10 deg C tolerance, and "temperature follows power", come from
      the reference farm's immersion cooling. Air-cooled boards often run above 70 deg C and
      would be held at the lowest step. Should setup ask for the cooling type and set its own
      defaults?
    priority: P3
    status: open
    source: "genericity review, 2026-10-07 (deferred by the owner)"
    date: "2026-10-07"
    tags: [temperature]
